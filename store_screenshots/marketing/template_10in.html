<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 2560px;
    overflow: hidden;
    background: #FBF5FF;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .canvas {
    position: relative;
    width: 1600px;
    height: 2560px;
    background: linear-gradient(160deg, #FBF5FF 0%, #F3E9FF 55%, #EAE0FB 100%);
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(3px);
  }
  .blob-1 {
    width: 1200px; height: 1200px;
    top: -560px; left: -427px;
    background: radial-gradient(circle at 30% 30%, #C4A6F5, #8B5CF6 70%);
    opacity: 0.55;
  }
  .blob-2 {
    width: 933px; height: 933px;
    bottom: -400px; right: -373px;
    background: radial-gradient(circle at 60% 40%, #A78BFA, #6D28D9 70%);
    opacity: 0.5;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 37px solid #8B5CF6;
    opacity: 0.18;
  }
  .ring-1 { width: 693px; height: 693px; top: 160px; right: -240px; }
  .ring-2 { width: 507px; height: 507px; bottom: 347px; left: -213px; }

  .headline {
    position: absolute;
    top: 147px;
    left: 80px;
    right: 80px;
    text-align: center;
    font-size: 88px;
    font-weight: 800;
    line-height: 1.15;
    color: #3B1E7A;
    letter-spacing: -1px;
  }
  .subtext {
    position: absolute;
    top: 400px;
    left: 120px;
    right: 120px;
    text-align: center;
    font-size: 43px;
    font-weight: 400;
    color: #6B5B95;
    line-height: 1.4;
  }

  .phone-wrap {
    position: absolute;
    top: 613px;
    left: 50%;
    width: 853px;
    height: 1680px;
    margin-left: -427px;
    transform: perspective(1867px) rotateY(TILT_Ydeg) rotateX(0deg);
    transform-style: preserve-3d;
  }
  .phone-shadow {
    position: absolute;
    width: 853px;
    height: 1680px;
    border-radius: 85px;
    background: #3B1E7A;
    filter: blur(67px);
    opacity: 0.35;
    top: 53px;
    left: 40px;
  }
  .phone-frame {
    position: relative;
    width: 853px;
    height: 1680px;
    background: #111;
    border-radius: 85px;
    padding: 24px;
    box-shadow: 0 53px 107px rgba(59,30,122,0.35);
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 64px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .notch {
    position: absolute;
    top: 24px;
    left: 50%;
    margin-left: -93px;
    width: 187px;
    height: 45px;
    background: #111;
    border-radius: 27px;
    z-index: 5;
  }

  .badge {
    position: absolute;
    top: 2373px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 19px;
    background: #fff;
    padding: 24px 48px;
    border-radius: 133px;
    box-shadow: 0 13px 40px rgba(59,30,122,0.15);
  }
  .badge .dot {
    width: 19px; height: 19px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6, #4C1D95);
  }
  .badge span {
    font-size: 37px;
    font-weight: 700;
    color: #3B1E7A;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="headline">HEADLINE_TEXT</div>
    <div class="subtext">SUBTEXT_TEXT</div>
    <div class="phone-wrap">
      <div class="phone-shadow"></div>
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="phone-screen">
          <img src="data:image/png;base64,IMAGE_DATA">
        </div>
      </div>
    </div>
    <div class="badge"><div class="dot"></div><span>100% On-Device · No Uploads</span></div>
  </div>
</body>
</html>
